<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>course schedule</title>

</head>
<body>
    <h1>Course Schedule</h1>
    <p>This is a simple course schedule page.</p>
    <table border="1">
       <caption>Course Schedule</caption>
       <thead>
           <tr>
               <th scope="col">Course</th>
               <th scope="col">Day</th>
               <th scope="col">Time</th>
           </tr>
         </thead>
         <tbody>
        <tr>
            <th scope="row group" rowspan="2">HTML Content </th>
            <td>Monday</td>
            <td>10:00 AM - 11:30 AM</td>

        </tr>
        <tr>
            <td>Wednesday</td>
            <td>10:00 AM - 11:30 AM</td>
        </tr>
        <tr>
    <th scope="row">HTML Forms</th>
    <td>Thursday</td>
    <td>4</td>
</tr>
         </tbody>
         <tfoot>
    <tr>
        <th colspan="2">Total Hours</th>
        <td>9</td>
    </tr>
</tfoot>
    </table>
    

</body>
</html>
